name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BIGTABLE_EMULATOR_HOST: localhost:8086

    steps:
      - uses: actions/checkout@v4

      - name: Start BigTable emulator
        run: |
          docker run -d -p 8086:8086 --name bigtable-emulator \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators bigtable start --host-port=0.0.0.0:8086
          timeout 30 bash -c 'until nc -z localhost 8086; do sleep 1; done'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The order the Dockerfile installs in, so the tests see the image's packages.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --force-reinstall "zstandard>=0.23.0"
          pip install -r requirements.txt
          pip install pytest pytest-cov psutil

      - name: Run tests with coverage
        run: python -m pytest --cov=pcgl2cache --cov-report=xml tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
